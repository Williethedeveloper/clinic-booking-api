<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinic Appointment Booking</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1f2937;
      background: #f9fafb;
    }
    h1 { color: #111827; }
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.9rem; }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #4b5563; margin-top: 10px; }
    button.secondary:hover { background: #374151; }
    .slot-list { list-style: none; padding: 0; margin: 0; }
    .slot-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 0.92rem;
    }
    .badge-avail { color: #15803d; background: #dcfce7; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .badge-booked { color: #b91c1c; background: #fee2e2; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .success { background: #dcfce7; border: 1px solid #16a34a; padding: 16px; border-radius: 8px; }
    .error { background: #fee2e2; border: 1px solid #dc2626; padding: 16px; border-radius: 8px; }
  </style>
</head>
<body>

  <h1>🏥 Clinic Appointment Booking</h1>

  <div class="card">
    <label for="apiKey">X-API-Key</label>
    <input type="text" id="apiKey" placeholder="Enter your X-API-Key" />
    <button onclick="loadSlots()">Refresh Slots</button>
    <button class="secondary" onclick="seedDemoSlots()">Reset & Load Demo Slots (/reset)</button>
  </div>

  <div class="card">
    <h2>Available Slots</h2>
    <ul id="slotsList" class="slot-list">
      <li>Loading slots...</li>
    </ul>
  </div>

  <div class="card">
    <h2>Book an Appointment</h2>
    <form onsubmit="bookAppointment(event)">
      <label for="slotSelect">Choose Available Slot</label>
      <select id="slotSelect" required>
        <option value="">-- Select an available slot --</option>
      </select>

      <label for="nameInput">Full Name</label>
      <input type="text" id="nameInput" placeholder="Ada Obi" required />

      <label for="emailInput">Email Address</label>
      <input type="email" id="emailInput" placeholder="ada@example.com" required />

      <button type="submit">Book Appointment</button>
    </form>
  </div>

  <div id="confirmationArea"></div>

  <script>
    async function init() {
      try {
        const res = await fetch('/config');
        const cfg = await res.json();
        if (cfg.apiKey) {
          document.getElementById('apiKey').value = cfg.apiKey;
        }
      } catch (e) {}
      loadSlots();
    }

    function getApiKey() {
      return document.getElementById('apiKey').value.trim();
    }

    async function loadSlots() {
      const list = document.getElementById('slotsList');
      const select = document.getElementById('slotSelect');
      const confirmArea = document.getElementById('confirmationArea');

      try {
        const res = await fetch('/slots', {
          headers: { 'X-API-Key': getApiKey() }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to load slots');

        list.innerHTML = '';
        select.innerHTML = '<option value="">-- Select an available slot --</option>';

        if (!data.slots || data.slots.length === 0) {
          list.innerHTML = '<li>No slots found. Click "Reset & Load Demo Slots" above.</li>';
          return;
        }

        data.slots.forEach(slot => {
          const li = document.createElement('li');
          li.className = 'slot-item';
          li.innerHTML = `
            <span><strong>${slot.id}</strong> · ${slot.provider} (${new Date(slot.start).toLocaleString()})</span>
            <span class="${slot.available ? 'badge-avail' : 'badge-booked'}">
              ${slot.available ? 'Available' : 'Booked'}
            </span>
          `;
          list.appendChild(li);

          if (slot.available) {
            const opt = document.createElement('option');
            opt.value = slot.id;
            opt.textContent = `${slot.id} - ${slot.provider} (${new Date(slot.start).toLocaleString()})`;
            select.appendChild(opt);
          }
        });
      } catch (err) {
        confirmArea.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
      }
    }

    async function bookAppointment(e) {
      e.preventDefault();
      const slot_id = document.getElementById('slotSelect').value;
      const name = document.getElementById('nameInput').value;
      const email = document.getElementById('emailInput').value;
      const confirmArea = document.getElementById('confirmationArea');

      try {
        const res = await fetch('/bookings', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': getApiKey(),
            'Idempotency-Key': crypto.randomUUID()
          },
          body: JSON.stringify({ slot_id, name, email })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Booking failed');

        confirmArea.innerHTML = `
          <div class="success">
            <h3>✅ Booking Confirmed</h3>
            <p><strong>Booking ID:</strong> ${data.id}</p>
            <p><strong>Slot ID:</strong> ${data.slot_id}</p>
            <p><strong>Patient:</strong> ${data.name} (${data.email})</p>
            <p><strong>Status:</strong> ${data.status}</p>
            <p><strong>Booked At:</strong> ${new Date(data.created_at).toLocaleString()}</p>
          </div>
        `;
        await loadSlots();
      } catch (err) {
        confirmArea.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
      }
    }

    async function seedDemoSlots() {
      const confirmArea = document.getElementById('confirmationArea');
      try {
        const res = await fetch('/reset', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': getApiKey()
          },
          body: JSON.stringify({
            slots: [
              { id: 's1', provider: 'Dr Ade', start: '2026-12-10T09:00:00Z', end: '2026-12-10T09:30:00Z' },
              { id: 's2', provider: 'Dr Ade', start: '2026-12-10T10:00:00Z', end: '2026-12-10T10:30:00Z' },
              { id: 's3', provider: 'Dr Bello', start: '2026-12-10T11:00:00Z', end: '2026-12-10T11:30:00Z' }
            ]
          })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Reset failed');
        }
        confirmArea.innerHTML = '';
        await loadSlots();
      } catch (err) {
        confirmArea.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
